AWSTemplateFormatVersion: '2010-09-09'
Description: ISUCON13 practice - three competition EC2s and a separate benchmark EC2 (Tokyo)
Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-041289d910c114864
    Description: Official ISUCON13 application AMI in ap-northeast-1
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in VpcId, with an Internet Gateway route
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  MyIpCidr:
    Type: String
    Description: Your public IPv4 address with /32
    AllowedPattern: '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/32$'
Rules:
  TokyoOnly:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', ap-northeast-1]
        AssertDescription: Use the Tokyo region for the official AMI.
Resources:
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Competition instances - SSH and HTTPS from operator
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIpCidr
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref MyIpCidr
  BenchmarkSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Benchmark instance - SSH from operator
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIpCidr
  AppInternalIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: '-1'
      SourceSecurityGroupId: !Ref AppSecurityGroup
  BenchmarkToAppHttps:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref BenchmarkSecurityGroup
  BenchmarkToAppDnsUdp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: udp
      FromPort: 53
      ToPort: 53
      SourceSecurityGroupId: !Ref BenchmarkSecurityGroup
  BenchmarkToAppDnsTcp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 53
      ToPort: 53
      SourceSecurityGroupId: !Ref BenchmarkSecurityGroup
  App1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: c5.large
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref AppSecurityGroup]
          DeleteOnTermination: true
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 40
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-app1'
  App2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: c5.large
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref AppSecurityGroup]
          DeleteOnTermination: true
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 40
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-app2'
  App3:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: c5.large
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref AppSecurityGroup]
          DeleteOnTermination: true
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 40
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-app3'
  Benchmark:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: c5.2xlarge
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref BenchmarkSecurityGroup]
          DeleteOnTermination: true
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 40
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-benchmark'
Outputs:
  App1InstanceId:
    Value: !Ref App1
  App1PublicIp:
    Value: !GetAtt App1.PublicIp
  App1PrivateIp:
    Value: !GetAtt App1.PrivateIp
  App2InstanceId:
    Value: !Ref App2
  App2PublicIp:
    Value: !GetAtt App2.PublicIp
  App2PrivateIp:
    Value: !GetAtt App2.PrivateIp
  App3InstanceId:
    Value: !Ref App3
  App3PublicIp:
    Value: !GetAtt App3.PublicIp
  App3PrivateIp:
    Value: !GetAtt App3.PrivateIp
  BenchmarkInstanceId:
    Value: !Ref Benchmark
  BenchmarkPublicIp:
    Value: !GetAtt Benchmark.PublicIp
  BenchmarkPrivateIp:
    Value: !GetAtt Benchmark.PrivateIp
