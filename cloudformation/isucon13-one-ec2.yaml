AWSTemplateFormatVersion: '2010-09-09'
Description: Single EC2 ISUCON13 practice environment (Tokyo region)
Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Verified AMI ID available to your AWS account in ap-northeast-1 (build one if the old public AMI is unavailable)
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet with an Internet Gateway route
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  MyIpCidr:
    Type: String
    Description: Your public IPv4 CIDR, e.g. 203.0.113.10/32
    AllowedPattern: '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/32$'
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.medium, c5.large]
  VolumeSize:
    Type: Number
    Default: 30
    MinValue: 30
    MaxValue: 100
Resources:
  SshSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH access restricted to a single IPv4 address
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIpCidr
  PracticeInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      CreditSpecification:
        CPUCredits: standard
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref SshSecurityGroup]
          DeleteOnTermination: true
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSize
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: isucon13-one-instance
Outputs:
  InstanceId:
    Value: !Ref PracticeInstance
  PublicIp:
    Value: !GetAtt PracticeInstance.PublicIp
  SSHCommand:
    Value: !Sub 'ssh -i ~/.ssh/isucon-practice-key.pem ubuntu@${PracticeInstance.PublicIp}'
